name: BlittieProjector
options:
  bundleIdPrefix: com.wesleymoy
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    DEVELOPMENT_TEAM: 5D7367Q3PH
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

packages:
  ProjectorKit:
    path: Shared/ProjectorKit

targets:
  Projector:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Projector
    info:
      path: Projector/Info.plist
      properties:
        CFBundleDisplayName: Blittie Projector
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: "Blittie Projector uses the local network to send video links to your Blittie Screen on your LAN."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - "_vga-receiver._tcp"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesleymoy.BlittieProjector.iOS
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: ProjectorKit
      - target: ShareExtension
        embed: true

  ShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Send to Blittie Screen
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesleymoy.BlittieProjector.iOS.ShareExtension
        SKIP_INSTALL: YES
    dependencies:
      - package: ProjectorKit

schemes:
  Projector:
    build:
      targets:
        Projector: all
    run:
      config: Debug
    archive:
      config: Release
