<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Blittie Screen</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; font-family:-apple-system, BlinkMacSystemFont, sans-serif; }
  #pairing { max-width:640px; margin:0 auto; padding:24px; color:#eee; display:flex; flex-direction:column; gap:16px; }
  h1 { font-size:18px; margin:0; }
  #status { opacity:0.75; font-size:12px; }

  #remoteVideo {
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #000;
  }
  body.connected #pairing { display: none; }
  body.connected #remoteVideo { display: block; }
</style>
</head>
<body>
<div id="pairing">
  <h1>Blittie Screen</h1>
  <div id="status">waiting for an offer from Blittie Projector...</div>
</div>

<video id="remoteVideo" autoplay controls></video>

<script src="common.js"></script>
<script>
  const statusEl = document.getElementById('status');
  const remoteVideo = document.getElementById('remoteVideo');

  let pc = null;

  // Called directly by native Swift code (via callJavaScript) when an offer
  // arrives over HTTP at POST /offer. Returns the answer JSON string.
  async function acceptOffer(offerJson, turnURL) {
    const offer = JSON.parse(offerJson);

    pc = createPeerConnection(turnURL);
    wireConnectionStatus(pc, statusEl);
    // Captures this specific connection rather than reading the outer `pc`
    // variable, which __blittieTeardown below nulls out — otherwise a
    // late-firing event here would see null instead of the closed connection.
    const activePc = pc;
    activePc.addEventListener('connectionstatechange', () => {
      if (['disconnected', 'failed', 'closed'].includes(activePc.connectionState)) {
        window.webkit?.messageHandlers?.blittieMirrorDisconnected?.postMessage(activePc.connectionState);
      }
    });

    // 'track' fires as soon as setRemoteDescription(offer) parses the SDP's
    // media sections — well before ICE connects and real frames arrive.
    // Only switch to the full-screen video once it's actually playing, and
    // that's also native Swift's readiness signal for revealing the window.
    pc.addEventListener('track', (event) => {
      remoteVideo.srcObject = event.streams[0];
      remoteVideo.play().catch(() => {});
    });
    remoteVideo.addEventListener('playing', () => {
      document.body.classList.add('connected');
      window.webkit?.messageHandlers?.blittieMirrorReady?.postMessage('playing');
    });

    await pc.setRemoteDescription(offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    statusEl.textContent = 'gathering ICE candidates...';
    await waitForIceGatheringComplete(pc);

    return JSON.stringify(pc.localDescription);
  }

  window.__blittieAcceptOffer = (offerJson, turnURL) => acceptOffer(offerJson, turnURL);

  // Called by native Swift just before it closes this session's window, so
  // the Projector sees a clean DTLS close instead of having to wait out an
  // ICE consent-timeout to notice the connection is gone.
  window.__blittieTeardown = () => {
    if (pc) {
      pc.close();
      pc = null;
    }
    remoteVideo.srcObject = null;
    document.body.classList.remove('connected');
  };
</script>
</body>
</html>
