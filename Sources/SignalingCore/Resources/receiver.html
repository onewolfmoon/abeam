<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Receiver</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; font-family:-apple-system, BlinkMacSystemFont, sans-serif; }
  #pairing { max-width:640px; margin:0 auto; padding:24px; color:#eee; display:flex; flex-direction:column; gap:16px; }
  h1 { font-size:18px; margin:0; }
  #status { opacity:0.75; font-size:12px; }

  #remoteVideo {
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #000;
  }
  body.connected #pairing { display: none; }
  body.connected #remoteVideo { display: block; }
</style>
</head>
<body>
<div id="pairing">
  <h1>Receiver</h1>
  <div id="status">waiting for an offer from the Sender...</div>
</div>

<video id="remoteVideo" autoplay playsinline></video>

<script src="common.js"></script>
<script>
  const statusEl = document.getElementById('status');
  const remoteVideo = document.getElementById('remoteVideo');

  let pc = null;

  // Called directly by native Swift code (via callJavaScript) when an offer
  // arrives over HTTP at POST /offer. Returns the answer JSON string.
  async function acceptOffer(offerJson) {
    const offer = JSON.parse(offerJson);

    pc = createPeerConnection();
    wireConnectionStatus(pc, statusEl);
    exposeConnectionState(pc);

    // 'track' fires as soon as setRemoteDescription(offer) parses the SDP's
    // media sections — well before ICE connects and real frames arrive.
    // Only switch to the full-screen video once it's actually playing.
    pc.addEventListener('track', (event) => {
      remoteVideo.srcObject = event.streams[0];
      remoteVideo.play().catch(() => {});
    });
    remoteVideo.addEventListener('playing', () => {
      document.body.classList.add('connected');
    });

    await pc.setRemoteDescription(offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    statusEl.textContent = 'gathering ICE candidates...';
    await waitForIceGatheringComplete(pc);

    return JSON.stringify(pc.localDescription);
  }

  window.__vgaAcceptOffer = (offerJson) => acceptOffer(offerJson);
</script>
</body>
</html>
