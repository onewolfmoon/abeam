<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sender</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#111; color:#eee; font-family:-apple-system, BlinkMacSystemFont, sans-serif; }
  #app { max-width: 640px; margin: 0 auto; padding: 24px; display:flex; flex-direction:column; gap:16px; }
  h1 { font-size: 18px; margin: 0; }
  button { font-size:14px; padding:10px 16px; border-radius:8px; border:none; background:#0a84ff; color:white; cursor:pointer; }
  button:hover { background:#2b95ff; }
  button:disabled { background:#444; cursor:default; }
  textarea { width:100%; box-sizing:border-box; height:100px; background:#000; color:#8f8; font:12px/1.4 ui-monospace, monospace; border:1px solid #333; border-radius:6px; padding:8px; }
  input { font-size:14px; padding:9px 10px; box-sizing:border-box; background:#000; color:#eee; border:1px solid #333; border-radius:6px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row input { flex:1; }
  #status { opacity:0.75; font-size:12px; }
  video { width:100%; border-radius:8px; border:1px solid #333; background:#000; }
  label { font-size:13px; opacity:0.85; }
</style>
</head>
<body>
<div id="app">
  <h1>Sender</h1>

  <div>
    <label>Receiver address</label>
    <input id="receiverAddress" placeholder="e.g. 192.168.1.42:8787" />
  </div>

  <div class="row">
    <button id="shareBtn">Start Screen Sharing</button>
    <button id="stopBtn" disabled>Stop Sharing</button>
  </div>
  <video id="preview" autoplay playsinline muted></video>

  <div>
    <label>Send the offer straight to the Receiver</label>
    <div class="row">
      <button id="sendToReceiverBtn" disabled>Send to Receiver</button>
    </div>
  </div>

  <div>
    <label>...or exchange it manually</label>
    <textarea id="offerBox" readonly placeholder="Offer will appear here after you start sharing..."></textarea>
    <div class="row"><button id="copyOfferBtn">Copy Offer</button></div>
    <textarea id="answerBox" placeholder="Paste answer JSON here..."></textarea>
    <div class="row"><button id="connectBtn">Connect</button></div>
  </div>

  <div>
    <label>...or play a YouTube video on the Receiver instead</label>
    <div class="row">
      <input id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..." />
      <button id="sendYoutubeBtn">Send to Receiver</button>
    </div>
  </div>

  <div>
    <label>Remote control (while a YouTube video is playing on the Receiver)</label>
    <div class="row">
      <button id="seekBackBtn">⏪ 5s</button>
      <button id="playPauseBtn">⏯ Play/Pause</button>
      <button id="seekForwardBtn">⏩ 5s</button>
    </div>
  </div>

  <div id="status">idle</div>
</div>

<script src="common.js"></script>
<script>
  const shareBtn = document.getElementById('shareBtn');
  const stopBtn = document.getElementById('stopBtn');
  const preview = document.getElementById('preview');
  const receiverAddress = document.getElementById('receiverAddress');
  const sendToReceiverBtn = document.getElementById('sendToReceiverBtn');
  const offerBox = document.getElementById('offerBox');
  const answerBox = document.getElementById('answerBox');
  const connectBtn = document.getElementById('connectBtn');
  const copyOfferBtn = document.getElementById('copyOfferBtn');
  const youtubeUrl = document.getElementById('youtubeUrl');
  const sendYoutubeBtn = document.getElementById('sendYoutubeBtn');
  const seekBackBtn = document.getElementById('seekBackBtn');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const seekForwardBtn = document.getElementById('seekForwardBtn');
  const statusEl = document.getElementById('status');

  let pc = null;
  let localStream = null;

  wireCopyButton(copyOfferBtn, offerBox);

  receiverAddress.value = localStorage.getItem('vgaReceiverAddress') || '';

  function requireReceiverAddress() {
    const address = receiverAddress.value.trim();
    if (!address) {
      statusEl.textContent = 'enter the receiver\'s address first';
      return null;
    }
    localStorage.setItem('vgaReceiverAddress', address);
    return address;
  }

  shareBtn.addEventListener('click', async () => {
    shareBtn.disabled = true;
    statusEl.textContent = 'requesting screen share...';
    try {
      localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      preview.srcObject = localStream;
      // Also catches the user stopping the share from macOS's own
      // screen-recording menu-bar control, not just our Stop button.
      localStream.getVideoTracks()[0].addEventListener('ended', stopSharing);

      pc = createPeerConnection();
      wireConnectionStatus(pc, statusEl);
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      statusEl.textContent = 'gathering ICE candidates...';
      await waitForIceGatheringComplete(pc);

      offerBox.value = JSON.stringify(pc.localDescription);
      statusEl.textContent = 'offer ready — send it to a Receiver';
      stopBtn.disabled = false;
      sendToReceiverBtn.disabled = false;
    } catch (err) {
      statusEl.textContent = 'error: ' + err.message;
      shareBtn.disabled = false;
    }
  });

  // Primary path: POST the offer straight to Receiver's HTTP control
  // server and apply the answer it hands back, no copy/paste needed.
  sendToReceiverBtn.addEventListener('click', async () => {
    if (!pc) { statusEl.textContent = 'start screen sharing first'; return; }
    const address = requireReceiverAddress();
    if (!address) return;

    sendToReceiverBtn.disabled = true;
    statusEl.textContent = 'sending offer to receiver...';
    try {
      const response = await fetch(`http://${address}/offer`, {
        method: 'POST',
        body: offerBox.value
      });
      const answerText = await response.text();
      if (!response.ok) {
        throw new Error(`receiver returned ${response.status}: ${answerText}`);
      }
      answerBox.value = answerText;
      await pc.setRemoteDescription(JSON.parse(answerText));
      statusEl.textContent = 'connecting...';
    } catch (err) {
      statusEl.textContent = 'error: ' + err.message;
    } finally {
      sendToReceiverBtn.disabled = false;
    }
  });

  // Fallback path: paste an answer obtained some other way (e.g. from
  // Receiver's own manual "Accept Offer" UI).
  connectBtn.addEventListener('click', async () => {
    if (!pc) { statusEl.textContent = 'start screen sharing first'; return; }
    try {
      const answer = JSON.parse(answerBox.value);
      await pc.setRemoteDescription(answer);
      statusEl.textContent = 'connecting...';
    } catch (err) {
      statusEl.textContent = 'error: ' + err.message;
    }
  });

  // Independent of screen sharing: tells the Receiver to play a YouTube
  // video fullscreen instead of (or interrupting) whatever it's currently
  // showing.
  sendYoutubeBtn.addEventListener('click', async () => {
    const address = requireReceiverAddress();
    if (!address) return;
    const url = youtubeUrl.value.trim();
    if (!url) { statusEl.textContent = 'enter a youtube url first'; return; }

    sendYoutubeBtn.disabled = true;
    statusEl.textContent = 'sending youtube url to receiver...';
    try {
      const response = await fetch(`http://${address}/youtube`, {
        method: 'POST',
        body: url
      });
      const bodyText = await response.text();
      if (!response.ok) {
        throw new Error(`receiver returned ${response.status}: ${bodyText}`);
      }
      statusEl.textContent = 'receiver is playing the video';
    } catch (err) {
      statusEl.textContent = 'error: ' + err.message;
    } finally {
      sendYoutubeBtn.disabled = false;
    }
  });

  // Fire-and-forget, same style as sendYoutubeBtn: no session-state tracking
  // in this UI, so the buttons are just always live once a receiver address
  // is set, and the Receiver no-ops (409) if there's nothing to control.
  async function sendControl(path) {
    const address = requireReceiverAddress();
    if (!address) return;
    try {
      const response = await fetch(`http://${address}/control/${path}`, { method: 'POST' });
      if (!response.ok) {
        throw new Error(`receiver returned ${response.status}`);
      }
    } catch (err) {
      statusEl.textContent = 'error: ' + err.message;
    }
  }

  seekBackBtn.addEventListener('click', () => sendControl('seek-back'));
  playPauseBtn.addEventListener('click', () => sendControl('play-pause'));
  seekForwardBtn.addEventListener('click', () => sendControl('seek-forward'));

  function stopSharing() {
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }
    if (pc) {
      pc.close();
      pc = null;
    }
    preview.srcObject = null;
    offerBox.value = '';
    answerBox.value = '';
    shareBtn.disabled = false;
    stopBtn.disabled = true;
    sendToReceiverBtn.disabled = true;
    statusEl.textContent = 'idle';
  }

  stopBtn.addEventListener('click', stopSharing);
</script>
</body>
</html>
