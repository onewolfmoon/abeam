<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mirror</title>
<style>
  html, body { margin:0; padding:0; height:100%; }
  #preview {
    width:100%; height:100%; box-sizing:border-box;
    display:flex; align-items:center; justify-content:center;
  }
  video { width:100%; height:100%; object-fit:contain; display:none; }
  video.active { display:block; }
</style>
</head>
<body>
<div id="preview">
  <video id="localPreview" autoplay playsinline muted></video>
</div>

<script src="common.js"></script>
<script>
  const preview = document.getElementById('preview');
  const localPreview = document.getElementById('localPreview');

  let pc = null;
  let localStream = null;

  function teardown() {
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }
    if (pc) {
      pc.close();
      pc = null;
    }
    localPreview.srcObject = null;
    localPreview.classList.remove('active');
    preview.classList.remove('active');
    // Pushes to native Swift instead of leaving it to poll
    // __blittieIsCapturing() — fires for every teardown path (native Stop
    // button, the OS's own screen-recording stop control, or the Receiver
    // ending the session), which native Swift treats idempotently.
    window.webkit?.messageHandlers?.blittieMirrorStopped?.postMessage('stopped');
  }

  // Captures the screen, builds the offer, and waits for ICE gathering to
  // finish (no trickle ICE, matching receiver.html) so the returned SDP is
  // one self-contained blob. Called by native Swift via callJavaScript,
  // which sends the result to the Receiver over the shared connection and
  // hands the answer back via __blittieApplyAnswer — this page has no
  // networking of its own.
  window.__blittieCreateOffer = async (turnURL) => {
    localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    localPreview.srcObject = localStream;
    localPreview.classList.add('active');
    preview.classList.add('active');
    // Also catches the user stopping the share from macOS's own
    // screen-recording menu-bar control, not just native Swift's Stop button.
    localStream.getVideoTracks()[0].addEventListener('ended', teardown);

    pc = createPeerConnection(turnURL);
    // Captures this specific connection rather than reading the outer `pc`
    // variable, which teardown() below nulls out — otherwise a late-firing
    // event here would see null instead of the closed connection.
    const activePc = pc;
    activePc.addEventListener('connectionstatechange', () => {
      // Catches the Receiver ending the session on its end (closing its
      // window, or a different sender preempting it) — teardown() is
      // idempotent, so this is safe to also fire from our own close() call.
      if (['disconnected', 'failed', 'closed'].includes(activePc.connectionState)) {
        teardown();
      }
    });
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitForIceGatheringComplete(pc);

    return JSON.stringify(pc.localDescription);
  };

  window.__blittieApplyAnswer = async (answerJson) => {
    await pc.setRemoteDescription(JSON.parse(answerJson));
  };

  window.__blittieStopMirroring = () => {
    teardown();
  };
</script>
</body>
</html>
